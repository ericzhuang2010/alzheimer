cohort:
  donor_field: Donor ID
  neurotypical_reference_field: Neurotypical reference
  diagnosis_field: Cognitive Status
  sex_field: Sex
  apoe_field: APOE Genotype
  age_field: Age at Death
  pmi_field: PMI
  study_field: Primary Study Name
  pathology_field: Overall AD neuropathological Change
  included_diagnoses: [Dementia, No dementia]
  excluded_apoe: [2/4]
  apoe_groups:
    e2: [2/2, 2/3]
    e33: [3/3]
    e4: [3/4, 4/4]
  signature_groups:
    - {group_id: F_e2, sex: Female, apoe_group: e2}
    - {group_id: F_e33, sex: Female, apoe_group: e33}
    - {group_id: F_e4, sex: Female, apoe_group: e4}
    - {group_id: M_e2, sex: Male, apoe_group: e2}
    - {group_id: M_e33, sex: Male, apoe_group: e33}
    - {group_id: M_e4, sex: Male, apoe_group: e4}

assay:
  method_field: method
  method_value: 10Xv3.1
  used_field: Used in analysis
  umi_layer: layers/UMIs

taxonomy:
  broad_network_order:
    - Astrocytes
    - Excitatory_neurons
    - Inhibitory_neurons
    - Microglia
    - OPCs
    - Oligodendrocytes
    - Vasculature_cells
  expected_supertype_counts:
    Astrocytes: 6
    Excitatory_neurons: 41
    Inhibitory_neurons: 67
    Microglia: 4
    OPCs: 3
    Oligodendrocytes: 4
    Vasculature_cells: 4
  excluded_microglia_supertypes: [Monocyte, Lymphocyte]

thresholds:
  primary_min_nuclei: 20
  sensitivity_min_nuclei: 50
  min_donors_per_disease_arm: 3
  fdr: 0.05
  absolute_fold_change: 1.3

models:
  fine_grouped_formula: "~ 0 + diagnosis_sex_apoe_group + age_death_scaled + pmi_scaled + study"
  broad_pooled_formula: "~ diagnosis + sex + apoe_group + age_death_scaled + pmi_scaled + study"
  broad_grouped_formula: "~ 0 + diagnosis_sex_apoe_group + age_death_scaled + pmi_scaled + study"
  filter_group: diagnosis
  normalization: TMM
  robust: true
  fdr_method: BH

query_rules:
  phase18_parity_query: "FDR < 0.05 AND abs(logFC) > log2(1.3)"
  fdr_only_query_sensitivity: "FDR < 0.05"

streaming:
  block_observations: 1000
  checkpoint_every_blocks: 700
  csv_chunk_rows: 100000
  full_h5ad_sha256: true

storage:
  minimum_free_bytes: 120000000000
  safety_reserve_bytes: 80000000000
  large_artifact_classes:
    - raw_h5ad_csv
    - observation_level_arrays
    - observation_level_tables
    - pseudobulk_count_shards
    - checkpoint_snapshots
    - compressed_deg_shards
    - edgeR_model_objects
  retained_model_objects: false

random_seed: 20260820
