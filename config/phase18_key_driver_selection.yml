schema_version: phase18_key_driver_selection_config_v1

analysis:
  analysis_id: phase18_key_driver_selection_v1
  title: Data-driven selection of Phase 12 mitochondrial key drivers
  task_mode: key_driver_selection
  stable_task_id: global:key_driver_selection
  output_schema: mitochondrial_key_driver_selection_v1
  definitions_frozen: true
  execution_class: nonfinal_local_real_data_analysis

paths:
  phase12_directory: results/minerva_production/12_kda
  phase09_annotation: results/minerva_production/09_annotate_genes/gene_annotation_master.tsv.gz
  phase12_config: config/phase12_kda.yml
  fkda_source: scripts/NetWeaver/fKDA.R
  local_output_directory: results/local_pilot/18_key_driver_selection

run_scope:
  analysis_tier: primary
  groups: [F_e2, F_e33, F_e4, M_e2, M_e33, M_e4]
  directions: [AD_up_mito, AD_down_mito]
  minimum_effective_query_genes: 10
  expected_structural_slots: 648
  expected_phase12_eligible: 295
  expected_included_runs: 161

cases:
  - case_order: 1
    case_id: case1_core_mito_in_query
    label: MT-related and in query
  - case_order: 2
    case_id: case2_core_mito_not_in_query
    label: MT-related and not in query
  - case_order: 3
    case_id: case3_not_core_mito
    label: Not MT-related

filters:
  run_q_threshold: 0.05
  minimum_other_query_overlap: 2
  minimum_fold_enrichment_exclusive: 1.0
  minimum_coverage: 0.80
  aggregate_q_threshold: 0.05
  minimum_conservative_supporting_runs: 1

aggregation:
  method: ACAT
  implementation: NetWeaver-compatible
  primary_missing_action: omit
  sensitivity_missing_action: replace_with_one
  boundary_tolerance: 1.0e-300
  run_multiple_testing: BH_within_explicit_candidates
  aggregate_multiple_testing: BH_within_broad_network_across_cases

ranking:
  within: [broad_network, case_id]
  order: [aggregate_acat_q, aggregate_acat_p, current_symbol]
  display_limit: 5

stability:
  method: leave_one_fine_cell_type_out
  stable_nominal_fraction: 0.80
  recurrent_minimum_fine_cell_types: 2

sensitivity:
  coverage_thresholds: [0.50, 0.80, 1.00]
  mean_log_p_floor: 1.0e-300
  degree_match_draws: 100
  random_seed: 1818001

networks:
  order:
    - Astrocytes
    - CAMs
    - Excitatory_neurons
    - Inhibitory_neurons
    - Microglia
    - OPCs
    - Oligodendrocytes
    - T_cells
    - Vasculature_cells

outputs:
  validation_status: nonfinal_local_analysis
  declared_files:
    - key_driver_analysis_manifest.tsv
    - key_driver_case_manifest.tsv
    - key_driver_run_manifest.tsv
    - key_driver_input_inventory.tsv
    - key_driver_source_checks.tsv
    - key_driver_candidate_tests.tsv.gz
    - key_driver_conservative_support.tsv.gz
    - key_driver_gene_case_summary.tsv.gz
    - key_driver_candidates.tsv
    - key_driver_top5.tsv
    - key_driver_stability_replicates.tsv.gz
    - key_driver_stability_summary.tsv
    - key_driver_sensitivity_results.tsv.gz
    - key_driver_network_degree_sensitivity.tsv
    - key_driver_figure_data.tsv
    - key_driver_exclusion_summary.tsv
    - key_driver_filter_funnel.tsv
    - key_driver_stage_status.tsv
    - key_driver_checks.tsv
    - key_driver_artifacts.tsv
    - key_driver_status.tsv
