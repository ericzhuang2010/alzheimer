# NOTE (2026-08-29): this config remains in use by the authoritative
# returned-only simple aggregation (scripts/20_sex_apoe_kda_simple_aggr.py),
# which reads only the `scope` section (groups, broad_networks, group_labels).
# The `analysis.output_directory` and `analysis.figure_directory` entries below
# refer to the deprecated coverage/support candidate-selection release, now at
# "results/minerva_production/20_sex_apoe_kda (deprecated)".
schema_version: phase20_sex_apoe_kda_config_v2

analysis:
  analysis_id: phase20_sex_apoe_kda_v2
  title: ROSMAP sex/APOE by broad-cell non-MT key-driver aggregation
  task_mode: validated_phase12_min3_reaggregation
  stable_task_id: global:sex_apoe_non_mt_key_driver_aggregation
  output_schema: phase20_sex_apoe_non_mt_kda_v2
  execution_stage: local_production

paths:
  phase12_directory: results/minerva_production/12_kda
  phase18_config: config/phase18_key_driver_selection.yml
  historical_phase18_archive: results/minerva_production/18_key_driver_selection/archive
  source_directory: results/minerva_production/20_sex_apoe_kda_source
  output_directory: results/minerva_production/20_sex_apoe_kda
  figure_directory: results/figures/analysis/phase_20_sex_apoe_kda

source:
  analysis_tier: primary
  minimum_effective_query_genes: 3
  expected_structural_slots: 648
  expected_phase12_eligible: 295
  expected_included_runs: 295
  candidate_tests: phase20_source_candidate_tests.tsv.gz
  run_manifest: phase20_source_run_manifest.tsv
  source_checks: phase20_source_checks.tsv
  source_status: phase20_source_status.tsv
  source_artifacts: phase20_source_artifacts.tsv

inputs:
  candidate_tests: phase20_source_candidate_tests.tsv.gz
  run_manifest: phase20_source_run_manifest.tsv
  source_checks: phase20_source_checks.tsv
  source_status: phase20_source_status.tsv
  source_artifacts: phase20_source_artifacts.tsv
  inclusion_flag: phase20_included
  minimum_effective_query_genes: 3
  expected_candidate_test_rows: 2623910
  expected_aggregate_rows: 259548
  expected_included_runs: 295
  required_source_status: validated_complete

scope:
  groups: [F_e2, F_e33, F_e4, M_e2, M_e33, M_e4]
  group_labels:
    F_e2: {sex: Female, apoe_group: e2}
    F_e33: {sex: Female, apoe_group: e33}
    F_e4: {sex: Female, apoe_group: e4}
    M_e2: {sex: Male, apoe_group: e2}
    M_e33: {sex: Male, apoe_group: e33}
    M_e4: {sex: Male, apoe_group: e4}
  broad_networks:
    - Astrocytes
    - Excitatory_neurons
    - Inhibitory_neurons
    - Microglia
    - OPCs
    - Oligodendrocytes
    - Vasculature_cells
  directions: [AD_up_mito, AD_down_mito]
  eligible_case_id: non_mt_driver
  excluded_case_ids:
    - mt_driver
  expected_structural_categories: 42
  expected_analyzable_categories: 38
  expected_empty_categories: 4

filters:
  relaxed:
    minimum_coverage: 0.50
    run_q_threshold: 0.10
    aggregate_q_threshold: 0.10
  strict_reference:
    minimum_coverage: 0.80
    run_q_threshold: 0.05
    aggregate_q_threshold: 0.05
  exploratory:
    aggregate_q_upper: 0.20
  minimum_other_query_overlap: 2
  minimum_fold_enrichment_exclusive: 1.0
  minimum_supporting_runs: 1

aggregation:
  method: ACAT
  implementation: phase18_NetWeaver_compatible
  primary_missing_action: omit
  sensitivity_missing_action: replace_with_one
  boundary_tolerance: 1.0e-300
  run_multiple_testing: reconstructed_Phase12_call_specific_BH
  relaxed_multiple_testing: BH_among_coverage_eligible_non_MT_genes_within_category
  strict_multiple_testing: BH_among_strict_coverage_eligible_non_MT_genes_within_category
  secondary_multiple_testing: BH_across_all_relaxed_assessable_non_MT_category_gene_units

ranking:
  within: [signature_group, broad_network]
  order: [relaxed_category_acat_q, category_acat_p, current_symbol]
  detailed_display_limit: 10
  compact_display_limit: 5

stability:
  method: leave_one_fine_cell_type_out
  stable_nominal_fraction: 0.80
  recurrent_minimum_fine_cell_types: 2

sensitivity:
  coverage_thresholds: [0.50, 0.80, 1.00]
  support_run_q_thresholds: [0.05, 0.10]
  category_q_thresholds: [0.05, 0.10, 0.20]

expected_results:
  strict_candidates: 58
  strict_top5: 43
  strict_top10: 51
  strict_categories: 15
  relaxed_candidates: 74
  relaxed_top5: 48
  relaxed_top10: 63
  relaxed_categories: 16
  exploratory_inclusive_candidates: 89
  exploratory_only_candidates: 15
  exploratory_inclusive_top5: 54
  exploratory_inclusive_top10: 72
  exploratory_inclusive_categories: 17

outputs:
  validation_status: validated_complete
  declared_files:
    - 00_inputs/phase20_source_candidate_tests.tsv.gz
    - 00_inputs/phase20_source_run_manifest.tsv
    - 00_inputs/phase20_source_input_authority.tsv
    - 00_inputs/phase20_source_checks.tsv
    - phase20_category_manifest.tsv
    - phase20_driver_aggregates.tsv.gz
    - phase20_relaxed_candidates.tsv
    - phase20_strict_non_mt_reference_candidates.tsv
    - phase20_exploratory_leads.tsv
    - phase20_top10.tsv
    - phase20_top5_summary.tsv
    - phase20_conservative_support.tsv.gz
    - phase20_stability_replicates.tsv.gz
    - phase20_stability_summary.tsv
    - phase20_sensitivity_results.tsv.gz
    - phase20_direction_summary.tsv.gz
    - phase20_threshold_grid.tsv
    - phase20_filter_funnel.tsv
    - phase20_checks.tsv
    - phase20_artifacts.tsv
    - phase20_status.tsv
    - phase20_config_snapshot.yml
