schema_version: phase08_broad_deg_config_v1

analysis:
  analysis_id: phase08_broad_deg_v1
  title: ROSMAP donor-level broad-cell differential expression by sex and APOE
  numerator: AD
  denominator: NCI
  groups:
    - {group_id: F_e2, sex: Female, apoe_group: e2}
    - {group_id: F_e33, sex: Female, apoe_group: e33}
    - {group_id: F_e4, sex: Female, apoe_group: e4}
    - {group_id: M_e2, sex: Male, apoe_group: e2}
    - {group_id: M_e33, sex: Male, apoe_group: e33}
    - {group_id: M_e4, sex: Male, apoe_group: e4}
  broad_cell_order:
    - Astrocytes
    - Excitatory_neurons
    - Inhibitory_neurons
    - Microglia
    - OPCs
    - Oligodendrocytes
    - Vasculature_cells
  covariates: [age_death_scaled, pmi_scaled]
  count_source: RNA_counts
  method: edgeR_QL
  minimum_nuclei_primary: 20
  minimum_nuclei_sensitivity: 50
  minimum_donors_per_arm: 5
  confirmatory_donors_per_arm: 10

thresholds:
  strict:
    q_operator: lt
    q: 0.05
    absolute_fold_change_operator: gt
    absolute_fold_change: 1.3
  relaxed:
    q_operator: le
    q: 0.10
    absolute_fold_change_operator: ge
    absolute_fold_change: 1.2
  exploratory:
    q_operator: le
    q: 0.20
    absolute_fold_change: null

composition_sensitivity:
  enabled: true
  transform: centered_log_ratio
  zero_pseudocount_nuclei: 0.5
  maximum_pcs: 2
  diagnosis_blind: true

inputs:
  mapping: config/phase08_broad_cell_mapping.tsv
  source_bundle_filenames:
    astrocytes: Astrocytes.pseudobulk_counts.rds
    excitatory_set1: Excitatory_neurons_set1.pseudobulk_counts.rds
    excitatory_set2: Excitatory_neurons_set2.pseudobulk_counts.rds
    excitatory_set3: Excitatory_neurons_set3.pseudobulk_counts.rds
    immune: Immune_cells.pseudobulk_counts.rds
    inhibitory: Inhibitory_neurons.pseudobulk_counts.rds
    opcs: OPCs.pseudobulk_counts.rds
    oligodendrocytes: Oligodendrocytes.pseudobulk_counts.rds
    vasculature: Vasculature_cells.pseudobulk_counts.rds

profiles:
  local_pilot:
    execution_stage: local_pilot
    execution_phase: 1
    run_id: local_broad_deg_pilot_001
    source_pseudobulk_directory: results/local_pilot/07_pseudobulk
    annotation_master: results/local_pilot/09_annotate_genes/gene_annotation_master.tsv.gz
    annotation_status: results/local_pilot/09_annotate_genes/annotation_status.tsv
    output_directory: results/local_pilot/08_deg_broad
    source_rds_ids: [vasculature]
    broad_cell_types: [Vasculature_cells]
    expected_source_bundles: 1
    expected_fine_types_observed: 5
    expected_broad_types: 1
    expected_contrasts: 6
  minerva_production:
    execution_stage: minerva_production
    execution_phase: 2
    run_id: minerva_broad_deg_001
    source_pseudobulk_directory: results/minerva_production/07_pseudobulk
    annotation_master: results/minerva_production/09_annotate_genes/gene_annotation_master.tsv.gz
    annotation_status: results/minerva_production/09_annotate_genes/annotation_status.tsv
    output_directory: results/minerva_production/08_deg_broad
    source_rds_ids:
      - astrocytes
      - excitatory_set1
      - excitatory_set2
      - excitatory_set3
      - immune
      - inhibitory
      - opcs
      - oligodendrocytes
      - vasculature
    broad_cell_types:
      - Astrocytes
      - Excitatory_neurons
      - Inhibitory_neurons
      - Microglia
      - OPCs
      - Oligodendrocytes
      - Vasculature_cells
    expected_source_bundles: 9
    expected_fine_types_observed: 54
    expected_broad_types: 7
    expected_contrasts: 42

schemas:
  broad_bundle: broad_pseudobulk_counts_v1
  broad_samples: broad_pseudobulk_samples_v1
  contrast_manifest: broad_deg_contrast_manifest_v1
  results: broad_deg_results_v1
  contrast_status: broad_deg_contrast_status_v1
  diagnostics: broad_deg_model_diagnostics_v1
  signatures: broad_deg_signature_members_v1
  checks: broad_deg_checks_v1
  artifacts: broad_deg_artifacts_v1
  status: broad_deg_status_v1
