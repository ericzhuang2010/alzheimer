schema_version: seaad_phase15_pathway_deg_broad_config_v1
analysis_resolution: broad

inputs:
  deg_root: results/validation_human/08_deg_broad
  contrast_status: results/validation_human/08_deg_broad/broad_stratified_support/contrast_status.tsv
  result_index: results/validation_human/08_deg_broad/broad_stratified_support/result_index.tsv
  fine_pathway_root: results/validation_human/15_pathway_deg_fine
  legacy_module_membership: config/phase13_respiratory_modules.tsv
  mitocarta_source: data/reference/Human.MitoCarta3.0.xls

output:
  directory: results/validation_human/15_pathway_deg_broad

expected:
  broad_cell_types: 7
  sex_apoe_strata: 6
  structural_contrasts: 42
  completed_contrasts: 28
  nonestimable_contrasts: 14
  primary_rank_rows: 29180
  background_gene_rows: 43770
  query_definitions: 378
  pathway_definitions: 199
  legacy_modules: 4
  broad_mitocarta_pathways: 46
  complete_mitocarta_pathways: 149
  primary_gsea_rows: 8358
  primary_ora_rows: 75222
  broad_vs_fine_rows: 25074

analysis:
  scope: sex_apoe_stratified
  pooled_anchor_policy: excluded_from_primary_sex_apoe_analysis
  primary_mito_flag: is_core_mito_phase18
  enrichment_identifier: current_symbol_for_kda
  query_modes:
    Dementia_any_mito:
      order: 1
      direction: any
    Dementia_up_mito:
      order: 2
      direction: up
    Dementia_down_mito:
      order: 3
      direction: down
  deg_tiers:
    strict:
      order: 1
      role: confirmatory_thresholded_companion
      q_operator: lt
      q_threshold: 0.05
      absolute_fold_change_operator: gt
      absolute_fold_change: 1.3
    relaxed:
      order: 2
      role: prespecified_sensitivity
      q_operator: le
      q_threshold: 0.10
      absolute_fold_change_operator: ge
      absolute_fold_change: 1.2
    exploratory:
      order: 3
      role: hypothesis_generation_only
      q_operator: le
      q_threshold: 0.20
      absolute_fold_change: null
  minimum_query_size: 3
  negative_f_tolerance: 1.0e-8
  minimum_background_pathway_members: 5
  minimum_reference_coverage: 0.30
  small_pathway_upper_bound: 9
  significance_threshold: 0.05

gsea:
  engine: fgseaMultilevel
  required_fgsea_version: 1.28.0
  rank_statistic: sign_logFC_times_sqrt_F
  exponent: 1
  eps: 0
  sample_size: 101
  workers: 1
  seed_base: 152026
  minimum_pathway_size: 5
  minimum_reference_coverage: 0.30
  single_leading_edge_label: lower_confidence_single_leading_edge

collections:
  legacy_four:
    expected_programs: 4
  mitocarta_broad_46:
    expected_programs: 46
  mitocarta_complete_149:
    expected_programs: 149

references:
  mitocarta:
    release: MitoCarta3.0
    source_sha256: e6ada0ae8dcd5447a5efb6f77c69a1c10b1ffa66521540a1e81b92c61e5505f2

fdr:
  method: BH
  threshold: 0.05
  gsea_local_family: contrast_id_x_pathway_collection
  gsea_global_family: pathway_collection
  ora_local_family: contrast_id_x_deg_tier_x_query_mode_x_pathway_collection
  ora_global_family: deg_tier_x_query_mode_x_pathway_collection

redundancy:
  representative_jaccard_threshold: 0.25

fine_comparison:
  broad_deg_tier: strict
  significance_threshold: 0.05

schemas:
  status: seaad_broad_deg_pathway_status_v1
  checks: seaad_broad_deg_pathway_checks_v1
  artifacts: seaad_broad_deg_pathway_artifacts_v1
  reference_manifest: seaad_broad_deg_pathway_reference_manifest_v1
  program_manifest: seaad_broad_deg_pathway_program_manifest_v1
  program_membership: seaad_broad_deg_pathway_program_membership_v1
  contrast_manifest: seaad_broad_deg_pathway_contrast_manifest_v1
  rank_manifest: seaad_broad_deg_pathway_rank_manifest_v1
  ranked_genes: seaad_broad_deg_pathway_ranked_genes_v1
  gsea: seaad_broad_deg_pathway_gsea_v1
  significant_gsea: seaad_broad_deg_pathway_significant_gsea_v1
  background_manifest: seaad_broad_deg_pathway_background_manifest_v1
  background_genes: seaad_broad_deg_pathway_background_genes_v1
  ora_query_manifest: seaad_broad_deg_pathway_ora_query_manifest_v1
  ora_query_genes: seaad_broad_deg_pathway_ora_query_genes_v1
  ora: seaad_broad_deg_pathway_ora_v1
  significant_ora: seaad_broad_deg_pathway_significant_ora_v1
  broad_cell_summary: seaad_broad_deg_pathway_broad_cell_summary_v1
  sex_apoe_summary: seaad_broad_deg_pathway_sex_apoe_summary_v1
  broad_vs_fine: seaad_broad_deg_pathway_broad_vs_fine_concordance_v1
